x-spark-common: &spark-common
  build:
    context: ./spark
    dockerfile: Dockerfile
  volumes:
    - ./spark:/opt/spark-apps
    - ./data:/opt/spark-data
    - spark-models:/opt/spark-apps/als_model
    - spark-reco:/opt/spark-apps/recommendations
    - spark-checkpoints:/opt/spark-apps/checkpoints
  networks:
    - bigdata-net

x-airflow-common: &airflow-common
  image: recommendation-airflow:2.9.1
  environment:
    AIRFLOW__CORE__EXECUTOR: SequentialExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-bigdata}:${POSTGRES_PASSWORD:-bigdata}@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    RECO_DATABASE_URL: postgresql://${POSTGRES_USER:-bigdata}:${POSTGRES_PASSWORD:-bigdata}@postgres:5432/recommendation
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: recommendation
    POSTGRES_USER: ${POSTGRES_USER:-bigdata}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bigdata}
    SPARK_HOME: /opt/spark
    JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./kafka:/opt/kafka-apps:ro
    - ./spark:/opt/spark-apps
    - ./data:/opt/spark-data
    - spark-models:/opt/spark-apps/als_model
    - spark-reco:/opt/spark-apps/recommendations
    - airflow-logs:/opt/airflow/logs
  networks:
    - bigdata-net

services:

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bigdata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bigdata}
      POSTGRES_DB: recommendation
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d recommendation"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bigdata-net

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -exc
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
        || true
    restart: "no"

  # ── Zookeeper ─────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bigdata-net

  # ── Kafka Broker ───────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_MESSAGE_MAX_BYTES: 10485760
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - bigdata-net

  # ── Kafka Producer (optionnel — le DAG lance aussi le producteur) ─────────
  kafka-producer:
    build:
      context: ./kafka
      dockerfile: Dockerfile
    container_name: kafka-producer
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./data:/data
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: reviews
      DATA_PATH: /data/Reviews.csv
      DELAY_SECONDS: "0.05"
    restart: on-failure
    networks:
      - bigdata-net

  # ── Spark Master ───────────────────────────────────────────────────────────
  spark-master:
    <<: *spark-common
    container_name: spark-master
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/spark/sbin/start-master.sh && \
        tail -f /opt/spark/logs/*.out
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - HADOOP_USER_NAME=root
      - SPARK_USER=root
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=recommendation
      - POSTGRES_USER=${POSTGRES_USER:-bigdata}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-bigdata}
    ports:
      - "8080:8080"
      - "7077:7077"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ── Spark Worker ───────────────────────────────────────────────────────────
  spark-worker-1:
    <<: *spark-common
    container_name: spark-worker-1
    depends_on:
      spark-master:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/spark/sbin/start-worker.sh spark://spark-master:7077 && \
        tail -f /opt/spark/logs/*.out
    environment:
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_WEBUI_PORT=8081
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - HADOOP_USER_NAME=root
      - SPARK_USER=root
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=recommendation
      - POSTGRES_USER=${POSTGRES_USER:-bigdata}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-bigdata}
    ports:
      - "8081:8081"

  # ── Airflow Webserver ──────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: airflow-webserver
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_healthy
    ports:
      - "8088:8080"
    command: webserver

  # ── Airflow Scheduler ──────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_started
    command: scheduler

  # ── API FastAPI ────────────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: recommendation-api
    depends_on:
      postgres:
        condition: service_healthy
      spark-master:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./api/static:/app/static
      - spark-reco:/app/recommendations
      - spark-models:/app/als_model
      - ./spark/indexer_model:/app/indexer_model
    environment:
      RECO_PATH: /app/recommendations
      MODEL_PATH: /app/als_model
      INDEXER_PATH: /app/indexer_model
      TOP_N: "10"
      DATABASE_URL: postgresql://${POSTGRES_USER:-bigdata}:${POSTGRES_PASSWORD:-bigdata}@postgres:5432/recommendation
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - bigdata-net

  # ── Frontend (Nginx) — dashboard statique ──────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: recommendation-frontend:latest
    container_name: recommendation-frontend
    depends_on:
      - api
    ports:
      - "3000:80"
    networks:
      - bigdata-net

volumes:
  postgres-data:
  airflow-logs:
  spark-models:
  spark-reco:
  spark-checkpoints:

networks:
  bigdata-net:
    driver: bridge
